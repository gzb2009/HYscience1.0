<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home 下层新增区 — Skills + Compute（设计稿）</title>
    <style>
      :root {
        --bg: #f2f2f0;
        --surface: #fff;
        --text: #171717;
        --muted: #737373;
        --faint: #a3a3a3;
        --border: rgba(0, 0, 0, 0.15);
        --border-light: rgba(0, 0, 0, 0.1);
        --ink: #171717;
        --radius: 4px;
        --font: "PingFang SC", "Inter", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      body.modal-open {
        overflow: hidden;
      }

      /* 实现边界说明 */
      .impl-note {
        max-width: 60rem;
        margin: 0 auto;
        padding: 20px 12.5vw 0;
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
      }

      .impl-note strong {
        color: var(--text);
      }

      .impl-note code {
        font-size: 11px;
        background: rgba(0, 0, 0, 0.05);
        padding: 1px 4px;
        border-radius: 2px;
      }

      /* 上层占位：表示现有页面，非本设计范围 */
      .existing-placeholder {
        max-width: 60rem;
        margin: 16px auto 0;
        padding: 0 12.5vw;
        opacity: 0.38;
        pointer-events: none;
        user-select: none;
      }

      .existing-placeholder-inner {
        border: 1px dashed var(--border-light);
        border-radius: var(--radius);
        padding: 20px 16px;
        text-align: center;
        font-size: 12px;
        color: var(--faint);
        background: repeating-linear-gradient(
          -45deg,
          transparent,
          transparent 6px,
          rgba(0, 0, 0, 0.015) 6px,
          rgba(0, 0, 0, 0.015) 12px
        );
      }

      /* ═══ 本设计稿范围：下层新增 ═══ */
      .lower-wrap {
        max-width: 60rem;
        margin: 0 auto;
        padding: 24px 12.5vw 60px;
      }

      .lower-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 16px;
      }

      .lower-label::before,
      .lower-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-light);
      }

      .lower {
        display: grid;
        grid-template-columns: 1.65fr 1fr;
        gap: 28px 48px;
        align-items: start;
        padding-top: 4px;
        border-top: 1px solid var(--border);
      }

      .cap-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .cap-head h2 {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 600;
      }

      .cap-head h2 svg {
        color: var(--faint);
      }

      .cap-meta {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }

      .cap-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-btn {
        width: 28px;
        height: 28px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--muted);
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
      }

      .icon-btn:hover {
        border-color: var(--border);
        color: var(--text);
      }

      .text-btn {
        border: none;
        background: transparent;
        font: inherit;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
        padding: 4px 6px;
      }

      .text-btn:hover {
        color: var(--text);
      }

      .skill-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 10px;
      }

      .skill-card {
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 12px 10px 10px;
        min-height: 104px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        cursor: pointer;
      }

      .skill-card:hover {
        border-color: var(--border);
      }

      .skill-card.off {
        opacity: 0.55;
      }

      .skill-card-art {
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .skill-card-name {
        font-size: 11px;
        font-weight: 600;
        line-height: 1.3;
      }

      .skill-card-desc {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .skill-card-foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .mini-toggle {
        width: 26px;
        height: 14px;
        border-radius: 999px;
        background: var(--ink);
        position: relative;
      }

      .mini-toggle::after {
        content: "";
        position: absolute;
        top: 2px;
        right: 2px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fff;
      }

      .mini-toggle.off {
        background: #c4c4c4;
      }

      .mini-toggle.off::after {
        right: auto;
        left: 2px;
      }

      .tag {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 999px;
        border: 1px solid var(--border-light);
        color: var(--muted);
      }

      .tag.on {
        border-color: var(--ink);
        color: var(--ink);
      }

      .more-card {
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        background: transparent;
        min-height: 104px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
      }

      .more-card:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .more-card strong {
        font-size: 18px;
        font-weight: 500;
      }

      .compute-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .compute-item {
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        background: var(--surface);
        display: grid;
        grid-template-columns: 88px 1fr auto;
        align-items: center;
        cursor: pointer;
      }

      .compute-item:hover {
        border-color: var(--border);
      }

      .compute-item.active {
        border-color: var(--ink);
        box-shadow: inset 0 0 0 1px var(--ink);
      }

      .compute-graph {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 1px solid var(--border-light);
        background: rgba(0, 0, 0, 0.02);
      }

      .compute-info {
        padding: 10px 12px;
        min-width: 0;
      }

      .compute-info strong {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 2px;
      }

      .compute-info span {
        font-size: 10px;
        color: var(--muted);
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .compute-side {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px 10px 8px 0;
      }

      .compute-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink);
      }

      .compute-dot.off {
        background: var(--faint);
      }

      .settings-btn {
        width: 22px;
        height: 22px;
        border: none;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: var(--radius);
      }

      .settings-btn:hover {
        color: var(--text);
        background: rgba(0, 0, 0, 0.04);
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(242, 242, 240, 0.96);
        backdrop-filter: blur(6px);
        display: none;
        flex-direction: column;
        padding: 24px 12.5vw 32px;
        overflow: hidden;
      }

      .overlay.open {
        display: flex;
      }

      .overlay-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .overlay-head h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      .close-btn {
        width: 32px;
        height: 32px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        background: var(--surface);
        font-size: 18px;
        cursor: pointer;
        color: var(--muted);
      }

      .overlay-toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }

      .overlay-toolbar input {
        flex: 1;
        max-width: 280px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        padding: 7px 10px;
        font: inherit;
        font-size: 12px;
        background: var(--surface);
      }

      .overlay-toolbar button {
        font: inherit;
        font-size: 11px;
        padding: 6px 10px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
      }

      .overlay-body {
        flex: 1;
        overflow-y: auto;
      }

      .overlay-grid-skills {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }

      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(360px, 92vw);
        z-index: 110;
        background: var(--surface);
        border-left: 1px solid var(--border);
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.06);
        transform: translateX(100%);
        transition: transform 200ms ease;
        padding: 20px;
      }

      .drawer.open {
        transform: translateX(0);
      }

      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .drawer-head h3 {
        margin: 0;
        font-size: 14px;
      }

      .drawer fieldset {
        border: none;
        margin: 0 0 14px;
        padding: 0;
      }

      .drawer legend {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .drawer label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .drawer input,
      .drawer select {
        width: 100%;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        padding: 7px 10px;
        font: inherit;
        font-size: 12px;
        margin-bottom: 10px;
        background: var(--bg);
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 105;
        background: rgba(0, 0, 0, 0.2);
        display: none;
      }

      .drawer-backdrop.open {
        display: block;
      }

      @media (max-width: 820px) {
        .lower {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <p class="impl-note">
      <strong>实现边界</strong>：本设计稿只描述 <code>home.tsx</code> 里 <code>cs-dashboard</code> <strong>下方新增</strong>的一块。
      现有 Header、项目列表、最近会话的 JSX / CSS / 图标<strong>一律不改</strong>；实现时在
      <code>&lt;/div&gt; /* cs-dashboard */</code> 后插入新组件即可。
    </p>

    <div class="existing-placeholder" aria-hidden="true">
      <div class="existing-placeholder-inner">
        ↑ 现有 Home 页面（cs-workbench-header + cs-dashboard）— 不在本设计范围内，代码不改动
      </div>
    </div>

    <div class="lower-wrap">
      <div class="lower-label">新增 · cs-home-capabilities</div>

      <div class="lower">
        <section>
          <div class="cap-head">
            <h2>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="5" y="4" width="11" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5" />
                <rect x="8" y="7" width="11" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="#fff" />
              </svg>
              Skills
              <span class="cap-meta" id="skills-meta"></span>
            </h2>
            <div class="cap-actions">
              <button class="icon-btn" type="button" id="skills-settings" title="管理">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
                  <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
              </button>
              <button class="text-btn" type="button" id="open-skills">查看全部</button>
            </div>
          </div>
          <div class="skill-cards" id="skills-preview"></div>
        </section>

        <section>
          <div class="cap-head">
            <h2>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="7" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5" />
                <path d="M10 4v2M14 4v2M10 18v2M14 18v2M4 10h2M4 14h2M18 10h2M18 14h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
              Compute
            </h2>
            <button class="text-btn" type="button" id="open-compute">查看全部</button>
          </div>
          <div class="compute-stack" id="compute-stack"></div>
        </section>
      </div>
    </div>

    <div class="overlay" id="skills-overlay">
      <div class="overlay-head">
        <h1>Skills</h1>
        <button class="close-btn" type="button" data-close="skills">×</button>
      </div>
      <div class="overlay-toolbar">
        <input type="search" placeholder="搜索技能…" />
        <button type="button">+ GitHub</button>
        <button type="button">+ 本地</button>
      </div>
      <div class="overlay-body">
        <div class="overlay-grid-skills" id="skills-full"></div>
      </div>
    </div>

    <div class="overlay" id="compute-overlay">
      <div class="overlay-head">
        <h1>Compute · 全部环境</h1>
        <button class="close-btn" type="button" data-close="compute">×</button>
      </div>
      <div class="overlay-body">
        <div class="compute-stack" id="compute-full" style="max-width: 420px"></div>
      </div>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="drawer" id="compute-drawer">
      <div class="drawer-head">
        <h3 id="drawer-title">设置</h3>
        <button class="close-btn" type="button" id="close-drawer">×</button>
      </div>
      <div id="drawer-body"></div>
    </aside>

    <script>
      const graphs = {
        local: `<svg width="64" height="52" viewBox="0 0 64 52" fill="none"><rect x="14" y="12" width="36" height="24" rx="2" stroke="#171717" stroke-width="1.4"/><rect x="20" y="18" width="24" height="12" rx="1" fill="#171717" fill-opacity="0.08" stroke="#171717" stroke-width="1"/><path d="M24 8v4M32 8v4M40 8v4M24 36v4M32 36v4M40 36v4" stroke="#737373" stroke-width="1.2" stroke-linecap="round"/><circle cx="8" cy="26" r="2.5" fill="#171717"/><circle cx="56" cy="26" r="2.5" fill="#a3a3a3"/><path d="M10.5 26h3.5M50 26h3.5" stroke="#737373" stroke-width="1" stroke-dasharray="2 2"/></svg>`,
        ssh: `<svg width="64" height="52" viewBox="0 0 64 52" fill="none"><rect x="4" y="16" width="14" height="20" rx="1.5" stroke="#171717" stroke-width="1.3"/><rect x="22" y="10" width="20" height="32" rx="1.5" stroke="#171717" stroke-width="1.4" fill="#171717" fill-opacity="0.06"/><rect x="26" y="16" width="12" height="7" rx="1" fill="#171717" fill-opacity="0.2"/><rect x="26" y="27" width="12" height="7" rx="1" fill="#171717" fill-opacity="0.1"/><rect x="46" y="16" width="14" height="20" rx="1.5" stroke="#171717" stroke-width="1.3"/><path d="M18 26h4M42 26h4" stroke="#737373" stroke-width="1" stroke-linecap="round"/></svg>`,
        cloud: `<svg width="64" height="52" viewBox="0 0 64 52" fill="none"><path d="M18 32c0-6.6 5.4-12 12-12 2.2 0 4.2.6 6 1.6 1.5-2.8 4.5-4.6 7.8-4.6 4.8 0 8.7 3.9 8.7 8.7 0 .5 0 1-.1 1.5" stroke="#171717" stroke-width="1.3" stroke-linecap="round"/><ellipse cx="32" cy="30" rx="20" ry="10" stroke="#171717" stroke-width="1.4" fill="#171717" fill-opacity="0.05"/><circle cx="24" cy="28" r="3" fill="#171717" fill-opacity="0.35"/><circle cx="32" cy="26" r="3.5" fill="#171717"/><circle cx="40" cy="28" r="3" fill="#171717" fill-opacity="0.35"/></svg>`,
      }

      const settingsIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`

      const skillArt = () => `<svg width="28" height="28" viewBox="0 0 32 32" fill="none"><rect x="6" y="5" width="14" height="18" rx="2" stroke="#a3a3a3" stroke-width="1.3"/><rect x="10" y="9" width="14" height="18" rx="2" stroke="#171717" stroke-width="1.3" fill="#fff"/><path d="M13 14h8M13 17h8M13 20h5" stroke="#737373" stroke-width="1.1" stroke-linecap="round"/></svg>`

      const skills = [
        { name: "biology-core", desc: "单细胞 · 通路分析", on: true },
        { name: "literature-review", desc: "文献检索与引用", on: true },
        { name: "scvi-tools", desc: "scVI 整合流程", on: true },
        { name: "figure-export", desc: "期刊风格出图", on: true },
        { name: "stats-power", desc: "样本量与功效", on: true },
        { name: "ml-training", desc: "训练与调参", on: false },
        { name: "data-qc", desc: "质控报告", on: true },
        { name: "write-paper", desc: "Methods 起草", on: true },
        { name: "geo-fetch", desc: "GEO 数据拉取", on: false },
        { name: "physics-sim", desc: "数值模拟", on: false },
        { name: "rdkit-chem", desc: "分子描述符", on: false },
        { name: "protocol-lab", desc: "实验 protocol", on: false },
      ]

      const computes = [
        { kind: "local", title: "Local", sub: "本机 · 默认", active: true },
        { kind: "ssh", title: "SSH", sub: "lab-gpu-01 · 8×A100", active: false },
        { kind: "cloud", title: "Cloud", sub: "Modal · RunPod…", active: false },
      ]

      const drawerForms = {
        local: `<fieldset><legend>Local</legend><label>工作目录</label><input value="~/Desktop/AAAAAA" /><label>并发任务数</label><input type="number" value="2" /></fieldset>`,
        ssh: `<fieldset><legend>SSH</legend><label>主机</label><input value="lab-gpu-01.internal" /><label>用户</label><input value="research" /><label>端口</label><input type="number" value="22" /><label>密钥</label><input value="~/.ssh/id_ed25519" /></fieldset>`,
        cloud: `<fieldset><legend>Cloud</legend><label>Modal API</label><input type="password" value="••••••••" /><label>RunPod API</label><input placeholder="未配置" /><label>默认 Provider</label><select><option>Modal</option><option>RunPod</option></select></fieldset>`,
      }

      const skillCard = (s) => `<article class="skill-card${s.on ? "" : " off"}"><div class="skill-card-art">${skillArt()}</div><div class="skill-card-name">${s.name}</div><div class="skill-card-desc">${s.desc}</div><div class="skill-card-foot"><span class="tag${s.on ? " on" : ""}">${s.on ? "开" : "关"}</span><span class="mini-toggle${s.on ? "" : " off"}"></span></div></article>`

      const computeItem = (c) => `<article class="compute-item${c.active ? " active" : ""}"><div class="compute-graph">${graphs[c.kind]}</div><div class="compute-info"><strong>${c.title}</strong><span>${c.sub}</span></div><div class="compute-side"><span class="compute-dot${c.active ? "" : " off"}"></span><button class="settings-btn" type="button" data-settings="${c.kind}">${settingsIcon}</button></div></article>`

      const previewN = Math.min(6, Math.max(4, Math.floor(skills.length * 0.5)))
      document.getElementById("skills-meta").textContent = `· ${previewN} / ${skills.length}`

      const preview = document.getElementById("skills-preview")
      skills.slice(0, previewN).forEach((s) => preview.insertAdjacentHTML("beforeend", skillCard(s)))
      if (skills.length > previewN) {
        preview.insertAdjacentHTML("beforeend", `<button class="more-card" type="button" id="skills-more"><strong>+${skills.length - previewN}</strong><span>查看全部</span></button>`)
      }
      document.getElementById("skills-full").innerHTML = skills.map(skillCard).join("")
      document.getElementById("compute-stack").innerHTML = computes.map(computeItem).join("")
      document.getElementById("compute-full").innerHTML = computes.map(computeItem).join("")

      const openOverlay = (id) => { document.getElementById(id).classList.add("open"); document.body.classList.add("modal-open") }
      const closeOverlay = (id) => { document.getElementById(id).classList.remove("open"); document.body.classList.remove("modal-open") }
      const openDrawer = (kind) => {
        document.getElementById("drawer-title").textContent = { local: "Local 设置", ssh: "SSH 设置", cloud: "Cloud 设置" }[kind]
        document.getElementById("drawer-body").innerHTML = drawerForms[kind]
        document.getElementById("compute-drawer").classList.add("open")
        document.getElementById("drawer-backdrop").classList.add("open")
      }
      const closeDrawer = () => {
        document.getElementById("compute-drawer").classList.remove("open")
        document.getElementById("drawer-backdrop").classList.remove("open")
      }

      document.getElementById("open-skills").onclick = () => openOverlay("skills-overlay")
      document.getElementById("open-compute").onclick = () => openOverlay("compute-overlay")
      document.getElementById("skills-more")?.addEventListener("click", () => openOverlay("skills-overlay"))
      document.getElementById("skills-settings").onclick = () => openOverlay("skills-overlay")
      document.querySelectorAll("[data-close]").forEach((btn) => btn.onclick = () => closeOverlay(`${btn.dataset.close}-overlay`))
      document.addEventListener("click", (e) => { const btn = e.target.closest("[data-settings]"); if (btn) { e.stopPropagation(); openDrawer(btn.dataset.settings) } })
      document.getElementById("close-drawer").onclick = closeDrawer
      document.getElementById("drawer-backdrop").onclick = closeDrawer
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeDrawer(); document.querySelectorAll(".overlay.open").forEach((el) => closeOverlay(el.id)) } })
    </script>
  </body>
</html>
