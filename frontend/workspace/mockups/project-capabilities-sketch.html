<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home 全页预览（上层=现有页面占位，仅下层为设计范围）</title>
    <style>
      :root {
        --bg: #f2f2f0;
        --surface: #fff;
        --text: #171717;
        --muted: #737373;
        --faint: #a3a3a3;
        --border: rgba(0, 0, 0, 0.15);
        --border-light: rgba(0, 0, 0, 0.1);
        --ink: #171717;
        --paper: #fff;
        --radius: 4px;
        --font: "PingFang SC", "Inter", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      body.modal-open {
        overflow: hidden;
      }

      .page {
        padding: 56px 12.5vw 40px;
      }

      .shell {
        max-width: 60rem;
      }

      /* ═══ 上层：与现有 Home 完全一致，不改结构/图标 ═══ */
      .header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 24px;
        margin-bottom: 48px;
      }

      .brand-block {
        display: flex;
        align-items: flex-start;
        gap: 24px;
      }

      .brand-mark {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 1.5px solid var(--border-light);
        display: grid;
        place-items: center;
        background: var(--surface);
        flex-shrink: 0;
      }

      .brand-copy {
        padding-top: 14px;
      }

      .brand-copy h1 {
        margin: 0;
        font-size: 2.2rem;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .brand-copy p {
        margin: 8px 0 0;
        font-size: 14px;
        color: var(--muted);
      }

      .user-btn {
        width: 64px;
        height: 64px;
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 0;
      }

      .dashboard {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px 72px;
      }

      .col-recent {
        margin-left: 40px;
      }

      .section-head-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 0 12px;
      }

      .section-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-weight: 600;
        color: var(--text);
      }

      .section-head.lg {
        font-size: 24px;
      }

      .section-head.lg svg {
        width: 24px;
        height: 24px;
        color: var(--faint);
      }

      .section-head.sm {
        font-size: 16px;
        margin-bottom: 12px;
      }

      .section-head.sm svg {
        width: 16px;
        height: 16px;
        color: var(--faint);
      }

      .head-action {
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 22px;
        line-height: 0;
        padding: 4px;
        cursor: pointer;
      }

      .scroll-panel {
        max-height: min(240px, 32vh);
        overflow-y: auto;
        scrollbar-gutter: stable;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }

      .scroll-panel::-webkit-scrollbar {
        width: 6px;
      }

      .scroll-panel::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.18);
        border-radius: 999px;
      }

      .scroll-hint {
        font-size: 11px;
        color: var(--faint);
        margin-top: 6px;
        text-align: right;
      }

      .row-wrap {
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }

      .row-wrap:last-child {
        border-bottom: none;
      }

      .row-main {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
        padding: 10px 8px 10px 4px;
        border: none;
        background: transparent;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      .row-main:hover {
        background: rgba(0, 0, 0, 0.03);
      }

      .row-title-line {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .project-index {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1.5px solid var(--border-light);
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        flex-shrink: 0;
      }

      .row-title {
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row-meta {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .row-menu {
        width: 38px;
        height: 38px;
        border: none;
        background: transparent;
        color: var(--muted);
        flex-shrink: 0;
        cursor: pointer;
      }

      .list-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }

      .list-row:hover {
        background: rgba(0, 0, 0, 0.03);
      }

      .list-row:last-child {
        border-bottom: none;
      }

      .session-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .list-row .row-title {
        font-size: 12px;
        line-height: 18px;
      }

      .row-sub {
        font-size: 12px;
        color: var(--muted);
      }

      /* ═══ 下层：左宽 Skills · 右窄 Compute，黑白为主 ═══ */
      .lower {
        margin-top: 36px;
        padding-top: 28px;
        border-top: 1px dashed var(--border-light);
        display: grid;
        grid-template-columns: 1.65fr 1fr;
        gap: 28px 48px;
        align-items: start;
      }

      .cap-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .cap-head h2 {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 600;
      }

      .cap-head h2 svg {
        color: var(--faint);
      }

      .cap-meta {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }

      .cap-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-btn {
        width: 28px;
        height: 28px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--muted);
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
      }

      .icon-btn:hover {
        border-color: var(--border);
        color: var(--text);
      }

      .text-btn {
        border: none;
        background: transparent;
        font: inherit;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
        padding: 4px 6px;
      }

      .text-btn:hover {
        color: var(--text);
      }

      /* Skills 小卡片 — 左栏更宽，多列 */
      .skill-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 10px;
      }

      .skill-card {
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 12px 10px 10px;
        min-height: 104px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        cursor: pointer;
        transition: border-color 100ms ease;
      }

      .skill-card:hover {
        border-color: var(--border);
      }

      .skill-card.off {
        opacity: 0.55;
      }

      .skill-card-art {
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .skill-card-name {
        font-size: 11px;
        font-weight: 600;
        line-height: 1.3;
      }

      .skill-card-desc {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .skill-card-foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .mini-toggle {
        width: 26px;
        height: 14px;
        border-radius: 999px;
        background: var(--ink);
        position: relative;
      }

      .mini-toggle::after {
        content: "";
        position: absolute;
        top: 2px;
        right: 2px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fff;
      }

      .mini-toggle.off {
        background: #c4c4c4;
      }

      .mini-toggle.off::after {
        right: auto;
        left: 2px;
      }

      .tag {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 999px;
        border: 1px solid var(--border-light);
        color: var(--muted);
      }

      .tag.on {
        border-color: var(--ink);
        color: var(--ink);
      }

      .more-card {
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        background: transparent;
        min-height: 104px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
      }

      .more-card:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .more-card strong {
        font-size: 18px;
        font-weight: 500;
      }

      /* Compute — 右栏 3 种黑白图形，纵向堆叠 */
      .compute-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .compute-item {
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        background: var(--surface);
        display: grid;
        grid-template-columns: 88px 1fr auto;
        align-items: center;
        gap: 0;
        cursor: pointer;
        transition: border-color 100ms ease;
      }

      .compute-item:hover {
        border-color: var(--border);
      }

      .compute-item.active {
        border-color: var(--ink);
        box-shadow: inset 0 0 0 1px var(--ink);
      }

      .compute-graph {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 1px solid var(--border-light);
        background: rgba(0, 0, 0, 0.02);
      }

      .compute-info {
        padding: 10px 12px;
        min-width: 0;
      }

      .compute-info strong {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 2px;
      }

      .compute-info span {
        font-size: 10px;
        color: var(--muted);
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .compute-side {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px 10px 8px 0;
      }

      .compute-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink);
      }

      .compute-dot.off {
        background: var(--faint);
      }

      .settings-btn {
        width: 22px;
        height: 22px;
        border: none;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: var(--radius);
      }

      .settings-btn:hover {
        color: var(--text);
        background: rgba(0, 0, 0, 0.04);
      }

      /* 全屏 — 黑白 */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(242, 242, 240, 0.96);
        backdrop-filter: blur(6px);
        display: none;
        flex-direction: column;
        padding: 24px 12.5vw 32px;
        overflow: hidden;
      }

      .overlay.open {
        display: flex;
      }

      .overlay-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        flex-shrink: 0;
      }

      .overlay-head h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .close-btn {
        width: 32px;
        height: 32px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        background: var(--surface);
        font-size: 18px;
        cursor: pointer;
        color: var(--muted);
      }

      .overlay-toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        flex-shrink: 0;
      }

      .overlay-toolbar input {
        flex: 1;
        max-width: 280px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        padding: 7px 10px;
        font: inherit;
        font-size: 12px;
        background: var(--surface);
      }

      .overlay-toolbar button {
        font: inherit;
        font-size: 11px;
        padding: 6px 10px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
      }

      .overlay-body {
        flex: 1;
        overflow-y: auto;
      }

      .overlay-grid-skills {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }

      /* 设置抽屉 */
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(360px, 92vw);
        z-index: 110;
        background: var(--surface);
        border-left: 1px solid var(--border);
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.06);
        transform: translateX(100%);
        transition: transform 200ms ease;
        display: flex;
        flex-direction: column;
        padding: 20px;
      }

      .drawer.open {
        transform: translateX(0);
      }

      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .drawer-head h3 {
        margin: 0;
        font-size: 14px;
      }

      .drawer fieldset {
        border: none;
        margin: 0 0 14px;
        padding: 0;
      }

      .drawer legend {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .drawer label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .drawer input,
      .drawer select {
        width: 100%;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        padding: 7px 10px;
        font: inherit;
        font-size: 12px;
        margin-bottom: 10px;
        background: var(--bg);
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 105;
        background: rgba(0, 0, 0, 0.2);
        display: none;
      }

      .drawer-backdrop.open {
        display: block;
      }

      @media (max-width: 820px) {
        .dashboard {
          grid-template-columns: 1fr;
          gap: 24px;
        }
        .col-recent {
          margin-left: 0;
        }
        .lower {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <p style="max-width:60rem;margin:0 auto;padding:16px 12.5vw 0;font-size:12px;color:#737373;line-height:1.6">
      <strong style="color:#171717">说明</strong>：本文件为全页预览。上层 Header / 项目 / 最近会话对应现有
      <code style="font-size:11px;background:rgba(0,0,0,.05);padding:1px 4px">home.tsx</code>
      已实现部分，<strong style="color:#171717">实现时不改</strong>。设计范围仅下方 Skills + Compute 新增区 → 见
      <code style="font-size:11px;background:rgba(0,0,0,.05);padding:1px 4px">home-capabilities-lower-sketch.html</code>
    </p>
    <div class="page">
      <div class="shell">
        <!-- ═══ 上层：现有 home.tsx，实现时不改 ═══ -->
        <header class="header">
          <div class="brand-block">
            <div class="brand-mark" aria-hidden="true">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                <path d="M8 7l-2 5 2 5M16 7l2 5-2 5" stroke="#171717" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </div>
            <div class="brand-copy">
              <h1>HYscience</h1>
              <p>AI research agent for science</p>
            </div>
          </div>
          <button class="user-btn" aria-label="用户">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8" r="4" stroke="#737373" stroke-width="1.5" />
              <path d="M5 20c1.5-3 4-4.5 7-4.5s5.5 1.5 7 4.5" stroke="#737373" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
        </header>

        <div class="dashboard">
          <section>
            <div class="section-head-row">
              <h2 class="section-head lg">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4 7h16v12H4zM4 7l2-3h12l2 3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                </svg>
                项目
              </h2>
              <button class="head-action" title="新建项目">+</button>
            </div>
            <div class="scroll-panel" id="projects-panel"></div>
            <div class="scroll-hint">项目较多时在区域内滚动 ↓</div>
          </section>

          <section class="col-recent">
            <h2 class="section-head sm">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5" />
                <path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
              最近会话
            </h2>
            <div class="scroll-panel" id="sessions-panel"></div>
            <div class="scroll-hint">会话较多时在区域内滚动 ↓</div>
          </section>
        </div>

        <!-- ═══ 下层：左 Skills（宽）· 右 Compute（窄）═══ -->
        <div class="lower">
          <!-- 左：Skills -->
          <section>
            <div class="cap-head">
              <h2>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="5" y="4" width="11" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5" />
                  <rect x="8" y="7" width="11" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="#fff" />
                </svg>
                Skills
                <span class="cap-meta" id="skills-meta"></span>
              </h2>
              <div class="cap-actions">
                <button class="icon-btn" type="button" title="Skills 设置" id="skills-settings">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                  </svg>
                </button>
                <button class="text-btn" type="button" id="open-skills">查看全部</button>
              </div>
            </div>
            <div class="skill-cards" id="skills-preview"></div>
          </section>

          <!-- 右：Compute — 仅 3 种类型 -->
          <section>
            <div class="cap-head">
              <h2>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="7" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5" />
                  <path d="M10 4v2M14 4v2M10 18v2M14 18v2M4 10h2M4 14h2M18 10h2M18 14h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                Compute
              </h2>
              <button class="text-btn" type="button" id="open-compute">查看全部</button>
            </div>
            <div class="compute-stack" id="compute-stack"></div>
          </section>
        </div>
      </div>
    </div>

    <!-- Skills 全屏 -->
    <div class="overlay" id="skills-overlay" role="dialog" aria-modal="true">
      <div class="overlay-head">
        <h1>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="4" width="11" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="8" y="7" width="11" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="#fff" />
          </svg>
          Skills
        </h1>
        <button class="close-btn" type="button" data-close="skills">×</button>
      </div>
      <div class="overlay-toolbar">
        <input type="search" placeholder="搜索技能…" />
        <button type="button">+ GitHub</button>
        <button type="button">+ 本地</button>
      </div>
      <div class="overlay-body">
        <div class="overlay-grid-skills" id="skills-full"></div>
      </div>
    </div>

    <!-- Compute 全屏（多 Provider 列表） -->
    <div class="overlay" id="compute-overlay" role="dialog" aria-modal="true">
      <div class="overlay-head">
        <h1>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="7" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <path d="M10 4v2M14 4v2M4 10h2M18 10h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Compute · 全部环境
        </h1>
        <button class="close-btn" type="button" data-close="compute">×</button>
      </div>
      <div class="overlay-body">
        <div class="compute-stack" id="compute-full" style="max-width: 420px"></div>
      </div>
    </div>

    <!-- Compute 参数设置抽屉 -->
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="drawer" id="compute-drawer" aria-label="Compute 设置">
      <div class="drawer-head">
        <h3 id="drawer-title">Compute 设置</h3>
        <button class="close-btn" type="button" id="close-drawer">×</button>
      </div>
      <div id="drawer-body"></div>
    </aside>

    <script>
      /* 黑白 SVG 图形 — 3 种 Compute 类型 */
      const graphs = {
        local: `<svg width="64" height="52" viewBox="0 0 64 52" fill="none">
          <rect x="14" y="12" width="36" height="24" rx="2" stroke="#171717" stroke-width="1.4"/>
          <rect x="20" y="18" width="24" height="12" rx="1" fill="#171717" fill-opacity="0.08" stroke="#171717" stroke-width="1"/>
          <path d="M24 8v4M32 8v4M40 8v4M24 36v4M32 36v4M40 36v4" stroke="#737373" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="8" cy="26" r="2.5" fill="#171717"/>
          <circle cx="56" cy="26" r="2.5" fill="#a3a3a3"/>
          <path d="M10.5 26h3.5M50 26h3.5" stroke="#737373" stroke-width="1" stroke-dasharray="2 2"/>
        </svg>`,
        ssh: `<svg width="64" height="52" viewBox="0 0 64 52" fill="none">
          <rect x="4" y="16" width="14" height="20" rx="1.5" stroke="#171717" stroke-width="1.3"/>
          <rect x="22" y="10" width="20" height="32" rx="1.5" stroke="#171717" stroke-width="1.4" fill="#171717" fill-opacity="0.06"/>
          <rect x="26" y="16" width="12" height="7" rx="1" fill="#171717" fill-opacity="0.2"/>
          <rect x="26" y="27" width="12" height="7" rx="1" fill="#171717" fill-opacity="0.1"/>
          <rect x="46" y="16" width="14" height="20" rx="1.5" stroke="#171717" stroke-width="1.3"/>
          <path d="M18 26h4M42 26h4" stroke="#737373" stroke-width="1" stroke-linecap="round"/>
        </svg>`,
        cloud: `<svg width="64" height="52" viewBox="0 0 64 52" fill="none">
          <path d="M18 32c0-6.6 5.4-12 12-12 2.2 0 4.2.6 6 1.6 1.5-2.8 4.5-4.6 7.8-4.6 4.8 0 8.7 3.9 8.7 8.7 0 .5 0 1-.1 1.5" stroke="#171717" stroke-width="1.3" stroke-linecap="round"/>
          <ellipse cx="32" cy="30" rx="20" ry="10" stroke="#171717" stroke-width="1.4" fill="#171717" fill-opacity="0.05"/>
          <circle cx="24" cy="28" r="3" fill="#171717" fill-opacity="0.35"/>
          <circle cx="32" cy="26" r="3.5" fill="#171717"/>
          <circle cx="40" cy="28" r="3" fill="#171717" fill-opacity="0.35"/>
          <path d="M27 28h4M33 26h4" stroke="#fff" stroke-width="0.9" stroke-linecap="round"/>
        </svg>`,
      }

      const settingsIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>`

      const skillArt = () => `<svg width="28" height="28" viewBox="0 0 32 32" fill="none">
        <rect x="6" y="5" width="14" height="18" rx="2" stroke="#a3a3a3" stroke-width="1.3"/>
        <rect x="10" y="9" width="14" height="18" rx="2" stroke="#171717" stroke-width="1.3" fill="#fff"/>
        <path d="M13 14h8M13 17h8M13 20h5" stroke="#737373" stroke-width="1.1" stroke-linecap="round"/>
      </svg>`

      const skills = [
        { name: "biology-core", desc: "单细胞 · 通路分析", on: true },
        { name: "literature-review", desc: "文献检索与引用", on: true },
        { name: "scvi-tools", desc: "scVI 整合流程", on: true },
        { name: "figure-export", desc: "期刊风格出图", on: true },
        { name: "stats-power", desc: "样本量与功效", on: true },
        { name: "ml-training", desc: "训练与调参", on: false },
        { name: "data-qc", desc: "质控报告", on: true },
        { name: "write-paper", desc: "Methods 起草", on: true },
        { name: "geo-fetch", desc: "GEO 数据拉取", on: false },
        { name: "physics-sim", desc: "数值模拟", on: false },
        { name: "rdkit-chem", desc: "分子描述符", on: false },
        { name: "protocol-lab", desc: "实验 protocol", on: false },
      ]

      const computes = [
        { kind: "local", title: "Local", sub: "本机 · 默认", active: true },
        { kind: "ssh", title: "SSH", sub: "lab-gpu-01 · 8×A100", active: false },
        { kind: "cloud", title: "Cloud", sub: "Modal · RunPod…", active: false },
      ]

      const drawerForms = {
        local: `
          <fieldset><legend>Local</legend>
            <label>工作目录</label><input value="~/Desktop/AAAAAA" />
            <label>并发任务数</label><input type="number" value="2" />
          </fieldset>`,
        ssh: `
          <fieldset><legend>SSH</legend>
            <label>主机</label><input value="lab-gpu-01.internal" />
            <label>用户</label><input value="research" />
            <label>端口</label><input type="number" value="22" />
            <label>密钥</label><input value="~/.ssh/id_ed25519" />
            <label>远程 Python</label><input value="/opt/conda/bin/python" />
          </fieldset>`,
        cloud: `
          <fieldset><legend>Cloud Providers</legend>
            <label>Modal API</label><input type="password" value="••••••••" />
            <label>RunPod API</label><input type="password" placeholder="未配置" />
            <label>TensorPool</label><input type="password" placeholder="未配置" />
            <label>默认 Provider</label>
            <select><option>Modal</option><option>RunPod</option></select>
          </fieldset>`,
      }

      const skillCard = (s) => `
        <article class="skill-card${s.on ? "" : " off"}">
          <div class="skill-card-art">${skillArt()}</div>
          <div class="skill-card-name">${s.name}</div>
          <div class="skill-card-desc">${s.desc}</div>
          <div class="skill-card-foot">
            <span class="tag${s.on ? " on" : ""}">${s.on ? "开" : "关"}</span>
            <span class="mini-toggle${s.on ? "" : " off"}"></span>
          </div>
        </article>`

      const computeItem = (c) => `
        <article class="compute-item${c.active ? " active" : ""}" data-kind="${c.kind}">
          <div class="compute-graph">${graphs[c.kind]}</div>
          <div class="compute-info">
            <strong>${c.title}</strong>
            <span>${c.sub}</span>
          </div>
          <div class="compute-side">
            <span class="compute-dot${c.active ? "" : " off"}"></span>
            <button class="settings-btn" type="button" data-settings="${c.kind}" title="参数设置">${settingsIcon}</button>
          </div>
        </article>`

      const previewN = Math.min(6, Math.max(4, Math.floor(skills.length * 0.5)))
      document.getElementById("skills-meta").textContent = `· ${previewN} / ${skills.length}`

      const preview = document.getElementById("skills-preview")
      skills.slice(0, previewN).forEach((s) => preview.insertAdjacentHTML("beforeend", skillCard(s)))
      if (skills.length > previewN) {
        preview.insertAdjacentHTML(
          "beforeend",
          `<button class="more-card" type="button" id="skills-more"><strong>+${skills.length - previewN}</strong><span>查看全部</span></button>`,
        )
      }
      document.getElementById("skills-full").innerHTML = skills.map(skillCard).join("")

      document.getElementById("compute-stack").innerHTML = computes.map(computeItem).join("")
      document.getElementById("compute-full").innerHTML = computes.map(computeItem).join("")

      const projects = ["AAAAAA", "scRNA-seq-demo", "spatial-liver-2024", "proteomics-pilot", "ml-drug-repurpose", "physics-monte-carlo", "lab-notebook-sync", "geo-bulk-meta"]
      const sessions = [
        ["空间转录组分析", "AAAAAA"],
        ["质控与聚类", "scRNA-seq-demo"],
        ["Figure 2 修订", "spatial-liver-2024"],
        ["差异基因 GO", "AAAAAA"],
        ["Modal GPU 测试", "ml-drug-repurpose"],
        ["Methods 起草", "proteomics-pilot"],
        ["参数扫描 batch-3", "physics-monte-carlo"],
        ["SRA 下载校验", "geo-bulk-meta"],
      ]

      document.getElementById("projects-panel").innerHTML = projects
        .map(
          (name, i) => `
        <div class="row-wrap">
          <button class="row-main" type="button">
            <div class="row-title-line"><span class="project-index">${i + 1}</span><span class="row-title">${name}</span></div>
            <span class="row-meta"><span>${i % 4} 个会话</span><span>${i + 1}d</span></span>
          </button>
          <button class="row-menu" type="button">⋯</button>
        </div>`,
        )
        .join("")

      document.getElementById("sessions-panel").innerHTML = sessions
        .map(
          ([title, proj], i) => `
        <div class="list-row">
          <span class="session-body"><span class="row-title">${title}</span><span class="row-sub">${proj}</span></span>
          <span class="row-meta"><span>${i + 1}h</span></span>
        </div>`,
        )
        .join("")

      const openOverlay = (id) => {
        document.getElementById(id).classList.add("open")
        document.body.classList.add("modal-open")
      }
      const closeOverlay = (id) => {
        document.getElementById(id).classList.remove("open")
        document.body.classList.remove("modal-open")
      }

      const openDrawer = (kind) => {
        const labels = { local: "Local 设置", ssh: "SSH 设置", cloud: "Cloud 设置" }
        document.getElementById("drawer-title").textContent = labels[kind]
        document.getElementById("drawer-body").innerHTML = drawerForms[kind]
        document.getElementById("compute-drawer").classList.add("open")
        document.getElementById("drawer-backdrop").classList.add("open")
      }
      const closeDrawer = () => {
        document.getElementById("compute-drawer").classList.remove("open")
        document.getElementById("drawer-backdrop").classList.remove("open")
      }

      document.getElementById("open-skills").addEventListener("click", () => openOverlay("skills-overlay"))
      document.getElementById("open-compute").addEventListener("click", () => openOverlay("compute-overlay"))
      document.getElementById("skills-more")?.addEventListener("click", () => openOverlay("skills-overlay"))

      document.querySelectorAll("[data-close]").forEach((btn) => {
        btn.addEventListener("click", () => closeOverlay(`${btn.dataset.close}-overlay`))
      })

      document.querySelectorAll(".overlay").forEach((el) => {
        el.addEventListener("click", (e) => {
          if (e.target === el) closeOverlay(el.id)
        })
      })

      document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-settings]")
        if (!btn) return
        e.stopPropagation()
        openDrawer(btn.dataset.settings)
      })

      document.getElementById("close-drawer").addEventListener("click", closeDrawer)
      document.getElementById("drawer-backdrop").addEventListener("click", closeDrawer)
      document.getElementById("skills-settings").addEventListener("click", () => openOverlay("skills-overlay"))

      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return
        closeDrawer()
        document.querySelectorAll(".overlay.open").forEach((el) => closeOverlay(el.id))
      })
    </script>
  </body>
</html>
